<!--
  PLANTILLA BASE · tarjeta con el estilo de la web de ConfAI (tokens de app/globals.css y tailwind.config.js:
  bg-card #14142A, borde cai-border, radio 16px, Geist, texto #F1F1F4 / #A0A0B8 / #9090A8, primario #7D67C0, botones .btn).
  Copia este fichero a messages/<id>.html y cambia:
    - El kicker (pastilla superior): color según el tono (ver templates/tones.md).
    - Los textos. Variables: {{user_name}} {{plan_name}} {{plan_end_date}} {{days_left}} {{usage_percentage}}
    - Los botones: href="confai://checkout" | "confai://url?u=<url codificada>" | "confai://recheck" | "confai://dismiss" | "confai://signout"
  Solo HTML del subconjunto admitido (ver README). Sin <script>, sin on*=, sin CSS externo.
-->
<div style="background:#14142A;border:1px solid rgba(255,255,255,0.08);border-radius:16px;color:#F1F1F4;font-family:Geist,system-ui,-apple-system,'Segoe UI',sans-serif;padding:32px 36px 28px 36px;">

  <!-- LOGO: icono de la app + wordmark -->
  <p style="margin:0 0 20px 0;text-align:center;">
    <img src="https://raw.githubusercontent.com/GravitonAI-dev/app-messages/main/assets/logo.png" alt="ConfAI" width="32" height="40" style="vertical-align:middle;margin:0 8px 0 0;"><span style="vertical-align:middle;font-size:22px;font-weight:700;letter-spacing:-0.02em;color:#F1F1F4;">Conf<span style="color:#9B8FD4;">AI</span></span>
  </p>

  <!-- KICKER (pastilla): fondo = tono al 15 %, texto = tono -->
  <p style="margin:0 0 12px 0;text-align:center;"><span style="display:inline-block;background:rgba(125,103,192,0.15);color:#9B8FD4;font-size:12px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:4px 12px;border-radius:999px;">Kicker del mensaje</span></p>

  <!-- TITULAR -->
  <h1 style="margin:0 0 12px 0;text-align:center;font-size:28px;line-height:1.15;letter-spacing:-0.02em;font-weight:800;color:#F1F1F4;">Titular del mensaje</h1>

  <!-- PÁRRAFO -->
  <p style="margin:0 0 24px 0;text-align:center;font-size:15px;line-height:1.6;color:#A0A0B8;">Hola, <strong style="color:#F1F1F4;">{{user_name}}</strong>. Texto del mensaje con lo importante en <strong style="color:#F1F1F4;">negrita clara</strong>.</p>

  <!-- PANEL DE DATOS (opcional). La última fila va destacada en el color del tono. -->
  <table style="width:100%;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:4px 20px;margin:0 0 22px 0;font-size:15px;">
    <tr><td style="padding:12px 0;text-align:left;color:#A0A0B8;">Etiqueta</td><td style="padding:12px 0;text-align:right;color:#F1F1F4;font-weight:600;">Valor</td></tr>
    <tr><td style="padding:12px 0;text-align:left;color:#A0A0B8;border-top:1px solid rgba(255,255,255,0.08);">Plan</td><td style="padding:12px 0;text-align:right;color:#F1F1F4;font-weight:600;border-top:1px solid rgba(255,255,255,0.08);">{{plan_name}}</td></tr>
    <tr><td style="padding:12px 0;text-align:left;color:#A0A0B8;border-top:1px solid rgba(255,255,255,0.08);">Destacado</td><td style="padding:12px 0;text-align:right;color:#9B8FD4;font-weight:700;font-size:20px;border-top:1px solid rgba(255,255,255,0.08);">{{plan_end_date}}</td></tr>
  </table>

  <!-- BOTÓN PRIMARIO (.btn--primary) -->
  <p style="margin:0 0 10px 0;text-align:center;"><a href="confai://checkout" style="display:inline-block;background:#7D67C0;color:#FFFFFF;text-decoration:none;font-weight:600;font-size:16px;line-height:1;padding:14px 36px;border-radius:6px;">Acción principal</a></p>

  <!-- BOTÓN SECUNDARIO (.btn--secondary, opcional) -->
  <p style="margin:0 0 18px 0;text-align:center;"><a href="confai://dismiss" style="display:inline-block;background:rgba(125,103,192,0.14);color:#9B8FD4;border:1px solid rgba(125,103,192,0.55);text-decoration:none;font-weight:600;font-size:14px;line-height:1;padding:11px 24px;border-radius:6px;">Acción secundaria</a></p>

  <!-- NOTA AL PIE -->
  <p style="margin:0 0 0px 0;text-align:center;font-size:13px;line-height:1.5;color:#9090A8;">Texto pequeño de ayuda o <a href="confai://signout" style="color:#9B8FD4;text-decoration:underline;">un enlace</a>.</p>
</div>
