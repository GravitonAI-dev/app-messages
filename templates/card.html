<!--
  PLANTILLA · CUERPO de un mensaje. El marco lo pone la app con sus componentes del design system:
    - Centrados: AppDialog → título (JSON "title"), X si dismissible, pie con AppButton (JSON "actions") y AppLink a la izquierda (JSON "footer_link").
    - Esquina: AppBanner → icono y color del tono (JSON "tone"), este HTML como texto, "actions" como botón pequeño.
  Aquí solo va el contenido: párrafos, un panel de datos y, si quieres, el tile del icono (patrón AppEmptyState).
  NO pongas botones ni enlaces confai:// en el HTML: van en "actions" y "footer_link" para que sean AppButton/AppLink reales.
  Colores SIEMPRE como {{c.<rol>}} (ver templates/tones.md): la app los resuelve según el tema claro u oscuro.
  Variables de texto: {{user_name}} {{plan_name}} {{plan_end_date}} {{days_left}} {{usage_percentage}}
-->

<!-- TILE DEL ICONO (opcional, patrón AppEmptyState) -->
<p style="margin:0 0 12px 0;text-align:center;"><span style="display:inline-block;width:44px;height:44px;line-height:44px;background:{{c.surfaceRaised}};border:1px solid {{c.border}};border-radius:10px;text-align:center;"><img src="https://raw.githubusercontent.com/GravitonAI-dev/app-messages/main/assets/logo.png" alt="ConfAI" width="19" height="24" style="vertical-align:middle;"></span></p>

<!-- ENCABEZADO DEL CUERPO (opcional; title3 sobre textHeading). El título del diálogo ya va en el JSON. -->
<p style="margin:0 0 4px 0;text-align:center;font-size:13px;line-height:1.4;font-weight:600;color:{{c.textHeading}};">Encabezado del cuerpo</p>

<!-- PÁRRAFO (body 12.5px, textSecondary). Lo importante en negrita con textPrimary. -->
<p style="margin:0 0 14px 0;text-align:center;font-size:12.5px;line-height:1.5;color:{{c.textSecondary}};">Hola, <strong style="color:{{c.textPrimary}};">{{user_name}}</strong>. Texto del mensaje con lo importante en <strong style="color:{{c.textPrimary}};">negrita</strong>.</p>

<!-- PANEL DE DATOS (opcional): surfaceRaised + borde + radio 10; última fila destacada con el color del tono -->
<table style="width:100%;background:{{c.surfaceRaised}};border:1px solid {{c.border}};border-radius:10px;padding:2px 12px;margin:0 0 10px 0;font-size:12.5px;">
  <tr><td style="padding:8px 0;text-align:left;color:{{c.textMuted}};">Etiqueta</td><td style="padding:8px 0;text-align:right;color:{{c.textPrimary}};font-weight:600;">Valor</td></tr>
  <tr><td style="padding:8px 0;text-align:left;color:{{c.textMuted}};border-top:1px solid {{c.divider}};">Plan</td><td style="padding:8px 0;text-align:right;color:{{c.textPrimary}};font-weight:600;border-top:1px solid {{c.divider}};">{{plan_name}}</td></tr>
  <tr><td style="padding:8px 0;text-align:left;color:{{c.textMuted}};border-top:1px solid {{c.divider}};">Destacado</td><td style="padding:8px 0;text-align:right;color:{{c.brandPrimary}};font-weight:700;font-size:15px;border-top:1px solid {{c.divider}};">{{plan_end_date}}</td></tr>
</table>

<!-- NOTA (bodySmall, textTertiary) -->
<p style="margin:0 0 0px 0;text-align:center;font-size:12.5px;line-height:1.5;color:{{c.textTertiary}};">Texto pequeño de ayuda.</p>
