# Production server (the VPS): `docker compose pull && docker compose up -d`
# (CI publishes the image; see .github/workflows/deploy.yml). Variables: .env
# and/or .env.prod; when both exist, .env wins (env_file: the last file wins).
# Locally, compiled: `make up-local` (compose.prod.local.yaml, .env.prod.local).
#
# El contenido (index.json, codes.json, messages/, home/, assets/, preview/,
# templates/) NO se sirve desde la imagen, sino del clon del repo montado en
# /content: así publicar un mensaje es un `git reset --hard` al commit nuevo
# y una llamada a /internal/reload, sin reconstruir la imagen ni reiniciar el
# servicio. La imagen conserva su copia como respaldo: si se levanta sin este
# volumen, arranca con el contenido con el que se construyó.
services:
  app-messages:
    image: ghcr.io/gravitonai-dev/app-messages:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: server/Dockerfile
    env_file:
      - path: .env.prod
        required: false
      - path: .env
        required: false
    environment:
      PORT: 3000
      CONTENT_DIR: /content
    volumes:
      # El clon que mantiene el deploy en el commit desplegado. De sólo
      # lectura: el servicio nunca escribe contenido. Lo que sobra del clon
      # (server/, scripts/, .git) se monta pero no se sirve: /raw sólo publica
      # las rutas de PUBLISHED (fs-content-store.adapter.ts).
      - ${CONTENT_DIR_HOST:-./repo}:/content:ro
    ports:
      # Sólo para el proxy inverso del VPS, que pone el TLS y el dominio.
      - "127.0.0.1:${HOST_PORT:-3000}:3000"
    restart: unless-stopped
