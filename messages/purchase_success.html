<!-- purchase_success · cuerpo del AppDialog. Tono success en el valor destacado. -->
<p style="margin:0 0 12px 0;text-align:center;"><span style="display:inline-block;width:44px;height:44px;line-height:44px;background:{{c.surfaceRaised}};border:1px solid {{c.border}};border-radius:10px;text-align:center;"><img src="https://raw.githubusercontent.com/GravitonAI-dev/app-messages/main/assets/logo.png" alt="ConfAI" width="19" height="24" style="vertical-align:middle;"></span></p>
<p style="margin:0 0 4px 0;text-align:center;font-size:13px;line-height:1.4;font-weight:600;color:{{c.textHeading}};">¡Bienvenido a tu nuevo plan!</p>
<p style="margin:0 0 14px 0;text-align:center;font-size:12.5px;line-height:1.5;color:{{c.textSecondary}};">Hola, <strong style="color:{{c.textPrimary}};">{{user_name}}</strong>. Tu pago se ha completado correctamente y tu suscripción está activa.</p>
<table style="width:100%;background:{{c.surfaceRaised}};border:1px solid {{c.border}};border-radius:10px;padding:2px 12px;margin:0 0 10px 0;font-size:12.5px;">
  <tr><td style="padding:8px 0;text-align:left;color:{{c.textMuted}};">Plan</td><td style="padding:8px 0;text-align:right;color:{{c.textPrimary}};font-weight:600;">{{plan_name}}</td></tr>
  <tr><td style="padding:8px 0;text-align:left;color:{{c.textMuted}};border-top:1px solid {{c.divider}};">Válido hasta</td><td style="padding:8px 0;text-align:right;color:{{c.success}};font-weight:700;font-size:15px;border-top:1px solid {{c.divider}};">{{plan_end_date}}</td></tr>
</table>
<p style="margin:0 0 0px 0;text-align:center;font-size:12.5px;line-height:1.5;color:{{c.textTertiary}};">Si tienes alguna duda con respecto a tu facturación, escríbenos a soporte@confidentialai.es.</p>
