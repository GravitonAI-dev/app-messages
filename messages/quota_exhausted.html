<!-- quota_exhausted · cuerpo del AppDialog abajo centrado, encima del cuadro de entrada.
     Renovación y comienzo del periodo: {{usage_reset}} / {{usage_since}} (telemetría; sin dato, texto genérico).
     La barra es una tabla de una celda vacía: su alto (6 px) lo da el padding de la tabla, que la app pinta como un Table nativo con fondo y radio. -->
<p style="margin:0 0 16px 0;text-align:left;font-size:13px;line-height:1.5;color:{{c.textSecondary}};">Se renueva {{usage_reset}}.</p>
<table style="width:100%;background:{{c.danger}};border-radius:3px;padding:3px 0;margin:0 0 8px 0;"><tr><td style="padding:0;height:0;"></td></tr></table>
<table style="width:100%;margin:0;padding:0;font-size:12.5px;">
  <tr><td style="width:75%;padding:0;text-align:left;color:{{c.textTertiary}};">Consumo de IA {{usage_since}}</td><td style="width:25%;padding:0;text-align:right;font-weight:700;color:{{c.dangerText}};">{{usage_percentage}} %</td></tr>
</table>
