<!-- plan_expired · cuerpo del AppDialog. Tono danger en el valor destacado. -->
<p style="margin:0 0 14px 0;text-align:left;font-size:12.5px;line-height:1.5;color:{{c.textSecondary}};">Hola, <strong style="color:{{c.textPrimary}};">{{user_name}}</strong>. Tu plan <strong style="color:{{c.textPrimary}};">{{plan_name}}</strong> terminó el {{plan_end_date}} y tu cuenta está en pausa. Renueva o elige otro plan para seguir usando ConfAI. Tus documentos, clientes y librerías siguen guardados.</p>
<table style="width:100%;background:{{c.surfaceRaised}};border:1px solid {{c.border}};border-radius:10px;padding:2px 12px;margin:0 0 0px 0;font-size:12.5px;">
  <tr><td style="padding:8px 0;text-align:left;color:{{c.textMuted}};">Plan</td><td style="padding:8px 0;text-align:right;color:{{c.textPrimary}};font-weight:600;">{{plan_name}}</td></tr>
  <tr><td style="padding:8px 0;text-align:left;color:{{c.textMuted}};border-top:1px solid {{c.divider}};">Caducó el</td><td style="padding:8px 0;text-align:right;color:{{c.dangerText}};font-weight:700;font-size:15px;border-top:1px solid {{c.divider}};">{{plan_end_date}}</td></tr>
</table>
