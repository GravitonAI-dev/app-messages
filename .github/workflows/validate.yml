name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate.mjs
      - run: node scripts/test-fixtures.mjs
      - run: corepack enable
      - run: pnpm -C server install --frozen-lockfile
      - run: pnpm -C server test
