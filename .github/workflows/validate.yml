# Valida el contenido y el servicio dentro del contenedor (`--target test` de
# server/Dockerfile), con la misma toolchain con la que se publica la imagen.
# El runner sólo necesita docker: ni node ni pnpm, para que una versión que
# cambie en ubuntu-latest no pueda tumbar un despliegue.
name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          target: test
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
